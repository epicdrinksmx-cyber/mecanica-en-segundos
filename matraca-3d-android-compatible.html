<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mecánica en Segundos — Matraca 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d12;color:#edf3f6;font-family:system-ui,Arial,sans-serif}
#stage{position:relative;width:100vw;height:100dvh;max-width:560px;margin:auto;background:radial-gradient(ellipse at 50% 40%,#34414a,#151d23 50%,#080d12);overflow:hidden}
#view{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;top:14px;left:16px;right:16px;pointer-events:none;text-shadow:0 2px 10px #000}
.brand{font-size:10px;letter-spacing:.2em;font-weight:800}.sub{font-size:11px;color:#bdc9cf;margin-top:5px}
.controls{position:absolute;bottom:18px;left:14px;right:14px;display:flex;align-items:center;gap:8px}
button{background:#17242ddd;color:white;border:1px solid #9baab2;border-radius:24px;padding:10px 13px;font-weight:700}
#track{height:4px;background:#ffffff40;flex:1;border-radius:5px;overflow:hidden}#fill{height:100%;width:0;background:#e4edf1}
#clock{font-size:11px;min-width:35px;text-align:right}
#error{position:absolute;inset:20% 8% auto;padding:16px;border:1px solid #9a7449;border-radius:12px;background:#171d22;color:#fff;display:none;line-height:1.5}
@media(min-width:600px){body{display:grid;place-items:center}#stage{height:min(100dvh,995px);width:calc(min(100dvh,995px)*.5625);border:1px solid #39464d}}
</style>
</head>
<body>
<div id="stage">
<canvas id="view"></canvas>
<div class="hud"><div class="brand">MECÁNICA EN SEGUNDOS</div><div class="sub">Matraca de 3/8″ · demostración tridimensional</div></div>
<div id="error">No se pudo cargar el motor 3D. Comprueba tu conexión a internet y vuelve a abrir el archivo.</div>
<div class="controls"><button id="play">Pausar</button><div id="track"><div id="fill"></div></div><span id="clock">00:00</span><button id="reset">↺</button></div>
</div>

<!-- Versión clásica de Three.js: evita módulos ES y problemas de apertura file:// en Android. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.128.0/three.min.js"></script>
<script>
(function(){
if(!window.THREE){document.getElementById('error').style.display='block';return;}
const THREE=window.THREE,stage=document.getElementById('stage'),canvas=document.getElementById('view');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x121a20);scene.fog=new THREE.Fog(0x121a20,18,34);
const camera=new THREE.PerspectiveCamera(34,stage.clientWidth/stage.clientHeight,.1,80);
camera.position.set(0,5.4,15);camera.lookAt(0,0,0);
let renderer;
try{renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,alpha:false});}
catch(e){document.getElementById('error').style.display='block';document.getElementById('error').textContent='Tu navegador no pudo iniciar WebGL. Prueba Chrome actualizado.';return;}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.7));renderer.setSize(stage.clientWidth,stage.clientHeight,false);
renderer.setClearColor(0x121a20);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;
scene.add(new THREE.HemisphereLight(0xcbdde7,0x20272c,1.7));
function light(color,intensity,x,y,z){let l=new THREE.DirectionalLight(color,intensity);l.position.set(x,y,z);l.castShadow=true;scene.add(l);}
light(0xffe9ce,2.5,5,8,7);light(0x8bbbd7,2.1,-6,4,-5);light(0xffffff,1.1,-2,7,4);
let fillLight=new THREE.PointLight(0xd9a86b,1.1,20);fillLight.position.set(0,3,5);scene.add(fillLight);
const mat=(c,m,r)=>new THREE.MeshStandardMaterial({color:c,metalness:m,roughness:r});
const chrome=mat(0xb9c4ca,.92,.2),steel=mat(0x65747c,.86,.29),dark=mat(0x28343b,.82,.3),rubber=mat(0x121719,.08,.78),brass=mat(0xb58d4e,.82,.25),floorMat=mat(0x1c272e,.3,.7);
function add(geo,ma,parent,x,y,z,rx,ry,rz){let o=new THREE.Mesh(geo,ma);o.position.set(x||0,y||0,z||0);o.rotation.set(rx||0,ry||0,rz||0);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o;}
function cyl(parent,rt,rb,len,ma,x,y,z,axis){let rot=axis==='x'?[0,0,Math.PI/2]:axis==='z'?[Math.PI/2,0,0]:[0,0,0];return add(new THREE.CylinderGeometry(rt,rb,len,40),ma,parent,x,y,z,...rot);}
const floor=add(new THREE.PlaneGeometry(40,40),floorMat,scene,0,-1.35,0,-Math.PI/2);floor.receiveShadow=true;
const table=add(new THREE.BoxGeometry(18,.18,9),dark,scene,0,-1.48,-.5);table.receiveShadow=true;

// Grupo completo de herramienta, mango de acero y empuñadura negra.
const tool=new THREE.Group();scene.add(tool);
const handle=new THREE.Group();tool.add(handle);
cyl(handle,.105,.12,4.45,chrome,-2.25,0,0,'x');
cyl(handle,.185,.19,1.62,rubber,-4.15,0,0,'x');
for(let i=0;i<8;i++)add(new THREE.TorusGeometry(.187,.012,8,32),dark,handle,-4.83+i*.19,0,0,0,Math.PI/2,0);
cyl(handle,.19,.19,.12,dark,-5.02,0,0,'x');

// Cabeza ovalada realista mediante geometría extruida.
function headShape(w,h,r,d,ma,parent,z){
 let s=new THREE.Shape();s.moveTo(-w/2+r,-h/2);s.lineTo(w/2-r,-h/2);s.quadraticCurveTo(w/2,-h/2,w/2,-h/2+r);s.lineTo(w/2,h/2-r);s.quadraticCurveTo(w/2,h/2,w/2-r,h/2);s.lineTo(-w/2+r,h/2);s.quadraticCurveTo(-w/2,h/2,-w/2,h/2-r);s.lineTo(-w/2,-h/2+r);s.quadraticCurveTo(-w/2,-h/2,-w/2+r,-h/2);
 let g=new THREE.ExtrudeGeometry(s,{depth:d,bevelEnabled:true,bevelSegments:4,steps:1,bevelSize:.045,bevelThickness:.035,curveSegments:16});
 return add(g,ma,parent,.22,0,z);
}
const head=new THREE.Group();tool.add(head);
headShape(1.65,1.18,.4,.42,steel,head,-.22);
const lid=headShape(1.65,1.18,.12,.4,chrome,head,.19);
const gearGroup=new THREE.Group();gearGroup.position.set(.72,.02,.48);head.add(gearGroup);
cyl(gearGroup,.32,.32,.14,dark,0,0,0,'z');
const gear=new THREE.Group();gearGroup.add(gear);
cyl(gear,.28,.28,.14,brass,0,0,.03,'z');
for(let i=0;i<28;i++){let a=i*Math.PI*2/28;add(new THREE.BoxGeometry(.10,.075,.13),brass,gear,Math.cos(a)*.34,Math.sin(a)*.34,.03,0,0,a);}
cyl(gearGroup,.105,.105,.22,chrome,0,0,.12,'z');
// Uña de bloqueo simplificada y su pivote, mostrados claramente.
const pawlPivot=new THREE.Group();pawlPivot.position.set(.27,-.25,.62);head.add(pawlPivot);
add(new THREE.BoxGeometry(.43,.14,.12),dark,pawlPivot,.20,.02,0,0,0,-.38);
cyl(pawlPivot,.07,.07,.17,chrome,0,0,.04,'z');
const spring=new THREE.Group();spring.position.set(-.14,-.12,.03);pawlPivot.add(spring);
for(let i=0;i<4;i++)add(new THREE.TorusGeometry(.04,.012,8,20),brass,spring,i*.045,0,0,Math.PI/2,0,0);
// Selector superior.
const selector=new THREE.Group();selector.position.set(-.42,.38,.47);head.add(selector);
cyl(selector,.14,.14,.11,dark,0,0,0,'z');
add(new THREE.BoxGeometry(.07,.25,.08),chrome,selector,0,.15,.10,0,0,-.22);
add(new THREE.SphereGeometry(.07,20,12),brass,selector,0,.28,.10);
// Cuadro de salida y dado hexagonal.
const output=new THREE.Group();output.position.set(.72,.02,.57);head.add(output);
add(new THREE.BoxGeometry(.23,.23,.32),chrome,output,0,0,.12);
cyl(output,.25,.25,.42,dark,0,0,.47,'z');
add(new THREE.TorusGeometry(.21,.025,8,6),chrome,output,0,0,.69);
// Posición de la herramienta.
tool.position.set(.65,.10,0);tool.rotation.z=-.12;

// Pieza de trabajo y perno para la escena final.
const work=new THREE.Group();work.position.set(1,-.88,1.75);scene.add(work);
add(new THREE.BoxGeometry(2.8,.2,1.4),dark,work,0,-.1,0);
cyl(work,.11,.11,.55,chrome,0,-.34,0,'y');
cyl(work,.25,.25,.16,chrome,0,.04,0,'y',6);
const home=lid.position.clone(),D=16;let elapsed=0,playing=true,last=performance.now();
const smooth=(a,b,t)=>{let x=Math.max(0,Math.min(1,(t-a)/(b-a)));return x*x*(3-2*x);};
function pose(t){
 let open=smooth(4,5.5,t)*(1-smooth(7.7,8.4,t)),close=smooth(12,13.3,t);
 camera.position.set(0,5.4-1.0*smooth(4,5.5,t)*(1-smooth(12,13,t)),15-1.8*smooth(4,5.5,t)*(1-smooth(12,13,t)));camera.lookAt(0,0,0);
 tool.rotation.y=Math.sin(t*.8)*.12*(1-smooth(3.4,4.3,t));tool.rotation.z=-.12+Math.sin(t*.7)*.012;
 lid.position.set(home.x,home.y+open*.85-close*open*.85,home.z-open*.15+close*open*.15);
 lid.rotation.x=-open*.10*(1-close);
 gear.rotation.z=smooth(8,8.4,t)*(t<10? (t-8)*1.05:2.1+(t-10)*.12);
 pawlPivot.rotation.z=smooth(8,8.4,t)*(1-smooth(11.8,12.2,t))*Math.sin((t-8)*7)*.10;
 selector.rotation.z=smooth(10,11.1,t)*.7;
 tool.position.z=.42*smooth(13,14,t);
 output.rotation.z=Math.sin((t-13)*5)*.16*smooth(13,13.4,t)*(1-smooth(15.5,16,t));
 work.rotation.y=.4*smooth(13,15.8,t);
}
function render(now){requestAnimationFrame(render);let dt=Math.min((now-last)/1000,.05);last=now;if(playing)elapsed=Math.min(D,elapsed+dt);pose(elapsed);renderer.render(scene,camera);document.getElementById('fill').style.width=(elapsed/D*100)+'%';document.getElementById('clock').textContent='00:'+String(Math.floor(elapsed)).padStart(2,'0');if(elapsed>=D&&playing){playing=false;document.getElementById('play').textContent='Reproducir';}}
requestAnimationFrame(render);
document.getElementById('play').onclick=e=>{playing=!playing;if(elapsed>=D&&playing)elapsed=0;e.target.textContent=playing?'Pausar':'Reproducir';last=performance.now();};
document.getElementById('reset').onclick=()=>{elapsed=0;playing=true;last=performance.now();document.getElementById('play').textContent='Pausar';};
function resize(){camera.aspect=stage.clientWidth/stage.clientHeight;camera.updateProjectionMatrix();renderer.setSize(stage.clientWidth,stage.clientHeight,false);}window.addEventListener('resize',resize);resize();
})();
</script>
</body></html>
